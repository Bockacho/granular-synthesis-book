<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1260" viewBox="0 0 760 630" font-family="Helvetica, Arial, sans-serif" font-size="13">
<rect width="760" height="630" fill="#ffffff"/>
<text x="24" y="34" font-size="15" font-weight="600" fill="#1f1f1f">Grain length and density set the character of the cloud</text>
<text x="24" y="56" font-size="11.5" fill="#5f5f5f">Both scales are logarithmic. The zone boundaries are approximate and shift with the source.</text>
<line x1="120.0" x2="120.0" y1="120" y2="520" stroke="#e3e3e3"/>
<line x1="120" x2="700" y1="520.0" y2="520.0" stroke="#e3e3e3"/>
<line x1="313.3" x2="313.3" y1="120" y2="520" stroke="#e3e3e3"/>
<line x1="120" x2="700" y1="386.7" y2="386.7" stroke="#e3e3e3"/>
<line x1="506.7" x2="506.7" y1="120" y2="520" stroke="#e3e3e3"/>
<line x1="120" x2="700" y1="253.3" y2="253.3" stroke="#e3e3e3"/>
<line x1="700.0" x2="700.0" y1="120" y2="520" stroke="#e3e3e3"/>
<line x1="120" x2="700" y1="120.0" y2="120.0" stroke="#e3e3e3"/>
<rect x="124.0" y="350.5" width="185.3" height="165.5" rx="8" fill="#2F6FDB" fill-opacity="0.14" stroke="#2F6FDB"/>
<text x="216.7" y="432" text-anchor="middle" font-weight="600" fill="#1f1f1f">clicks, crackle</text>
<text x="216.7" y="448" text-anchor="middle" font-size="11.5" fill="#5f5f5f">short and sparse</text>
<rect x="124.0" y="124.0" width="243.5" height="125.3" rx="8" fill="#E8743B" fill-opacity="0.14" stroke="#E8743B"/>
<text x="132.0" y="215" text-anchor="start" font-weight="600" fill="#1f1f1f">buzz, tone</text>
<text x="132.0" y="231" text-anchor="start" font-size="11.5" fill="#5f5f5f">even stream: a note</text>
<text x="132.0" y="245" text-anchor="start" font-size="11.5" fill="#5f5f5f">scattered: a hiss</text>
<rect x="375.5" y="367.2" width="127.1" height="108.7" rx="8" fill="#23A877" fill-opacity="0.14" stroke="#23A877"/>
<text x="439.1" y="412" text-anchor="middle" font-weight="600" fill="#1f1f1f">drops, rattle</text>
<text x="439.1" y="428" text-anchor="middle" font-size="11.5" fill="#5f5f5f">dotted, with gaps</text>
<rect x="452.5" y="257.3" width="142.4" height="101.9" rx="8" fill="#2E4A7D" fill-opacity="0.14" stroke="#2E4A7D"/>
<text x="514.0" y="300" text-anchor="middle" font-weight="600" fill="#1f1f1f">cloud</text>
<text x="514.0" y="316" text-anchor="middle" font-size="11.5" fill="#5f5f5f">overlapping grains</text>
<rect x="510.7" y="430.8" width="185.3" height="85.2" rx="8" fill="#D6457A" fill-opacity="0.14" stroke="#D6457A"/>
<text x="520.0" y="485" text-anchor="start" font-weight="600" fill="#1f1f1f">slicing</text>
<text x="520.0" y="501" text-anchor="start" font-size="11.5" fill="#5f5f5f">scraps of the source</text>
<rect x="510.7" y="124.0" width="185.3" height="125.3" rx="8" fill="#2E8B2E" fill-opacity="0.14" stroke="#2E8B2E"/>
<text x="603.0" y="180" text-anchor="middle" font-weight="600" fill="#1f1f1f">wall</text>
<text x="603.0" y="196" text-anchor="middle" font-size="11.5" fill="#5f5f5f">the source is blurred</text>
<line x1="120.0" y1="120.0" x2="700.0" y2="520.0" stroke="#8a8a8a" stroke-width="1.5"/>
<line x1="313.3" y1="120.0" x2="700.0" y2="386.7" stroke="#8a8a8a" stroke-width="1.25" stroke-dasharray="5 4"/>
<text x="380.0" y="284" text-anchor="start" font-size="11.5" fill="#5f5f5f">O = 1</text>
<text x="430.0" y="186" text-anchor="start" font-size="11.5" fill="#5f5f5f">O = 10</text>
<line x1="120" x2="700" y1="520" y2="520" stroke="#8a8a8a" stroke-width="1.25"/>
<line x1="120" x2="120" y1="120" y2="520" stroke="#8a8a8a" stroke-width="1.25"/>
<text x="120.0" y="540" text-anchor="middle" font-size="11.5" fill="#5f5f5f">1 ms</text>
<text x="313.3" y="540" text-anchor="middle" font-size="11.5" fill="#5f5f5f">10 ms</text>
<text x="506.7" y="540" text-anchor="middle" font-size="11.5" fill="#5f5f5f">100 ms</text>
<text x="700.0" y="540" text-anchor="middle" font-size="11.5" fill="#5f5f5f">1 s</text>
<text x="112.0" y="524.0" text-anchor="end" font-size="11.5" fill="#5f5f5f">1</text>
<text x="112.0" y="390.7" text-anchor="end" font-size="11.5" fill="#5f5f5f">10</text>
<text x="112.0" y="257.3" text-anchor="end" font-size="11.5" fill="#5f5f5f">100</text>
<text x="112.0" y="124.0" text-anchor="end" font-size="11.5" fill="#5f5f5f">1000</text>
<text x="410.0" y="566" text-anchor="middle" fill="#1f1f1f">grain length</text>
<text x="48" y="320" text-anchor="middle" transform="rotate(-90 48 320)" fill="#1f1f1f">density, grains per second</text>
<text x="24.0" y="594" text-anchor="start" font-size="11.5" fill="#5f5f5f">Solid line: overlap 1, grains end to end. Left and below it, dotted with gaps; right and above it, a cloud.</text>
<text x="24.0" y="612" text-anchor="start" font-size="11.5" fill="#5f5f5f">Dashed line: overlap 10, beyond it the sound thickens into a wall.</text>
</svg>