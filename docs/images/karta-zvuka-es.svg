<text x="216.7" y="448" text-anchor="middle" font-size="11.5" fill="#9fb0b9">cortos y escasos</text>
<text x="132.0" y="215" text-anchor="start" font-weight="700" fill="#eef2f4">zumbido, tono</text>
<text x="132.0" y="231" text-anchor="start" font-size="11.5" fill="#9fb0b9">flujo regular: una nota</text>
<text x="132.0" y="245" text-anchor="start" font-size="11.5" fill="#9fb0b9">disperso: un siseo</text>
