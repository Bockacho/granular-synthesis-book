<text x="439.1" y="428" text-anchor="middle" font-size="11.5" fill="#9fb0b9">punteado con pausas</text>
<text x="514.0" y="300" text-anchor="middle" font-weight="700" fill="#eef2f4">nube</text>
<text x="514.0" y="316" text-anchor="middle" font-size="11.5" fill="#9fb0b9">granos solapados</text>
<text x="520.0" y="485" text-anchor="start" font-weight="700" fill="#eef2f4">troceado</text>
<text x="520.0" y="501" text-anchor="start" font-size="11.5" fill="#9fb0b9">retazos de la fuente</text>
<text x="603.0" y="180" text-anchor="middle" font-weight="700" fill="#eef2f4">muro</text>
<text x="603.0" y="196" text-anchor="middle" font-size="11.5" fill="#9fb0b9">la fuente se difumina</text>
