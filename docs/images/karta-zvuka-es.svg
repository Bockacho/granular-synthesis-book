<text x="24" y="596" font-size="10.6" fill="#9fb0b9">Línea continua: solapamiento 1, granos uno tras otro. A la izquierda y abajo, punteado con pausas; a la derecha y arriba, una nube.</text>
<text x="24" y="613" font-size="10.6" fill="#9fb0b9">Línea discontinua: solapamiento 10; más allá el sonido se espesa hasta ser un muro.</text>
