<text x="24" y="40" font-size="15.5" font-weight="700" fill="#eef2f4">La duración del grano y la densidad definen el carácter de la nube</text>
<text x="24" y="60" font-size="11.5" fill="#9fb0b9">Ambas escalas son logarítmicas. Los límites de las zonas son aproximados y varían según la fuente.</text>
