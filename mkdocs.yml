  - glightbox:
      zoomable: true
      skip_classes:
        - no-zoom
  - git-revision-date-localized:
      type: date
      locale: ru
      fallback_to_build_date: true
      strict: false

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Ссылка на этот раздел
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.smartsymbols

extra_css:
  - stylesheets/extra.css
  - stylesheets/retro.css

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/grain-demo.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Bockacho/granular-synthesis-book
      name: Исходники книги на GitHub
    - icon: fontawesome/brands/paypal
      link: https://paypal.me/limbmusic
      name: Поддержать автора через PayPal

copyright: >
