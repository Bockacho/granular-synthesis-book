site_name: Гранулярный синтез
site_description: Учебник по гранулярному синтезу для электронных музыкантов — от первого зерна до игры вживую.
site_url: https://bockacho.github.io/granular-synthesis-book/
repo_url: https://github.com/Bockacho/granular-synthesis-book
repo_name: Bockacho/granular-synthesis-book
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  language: ru
  font:
    text: Golos Text
    code: JetBrains Mono
  icon:
    logo: material/grain
    repo: fontawesome/brands/github
    edit: material/pencil
  favicon: images/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Тема как в системе
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Тёмная тема
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.action.view
    - content.tooltips

hooks:
  - hooks/ui_labels.py

plugins:
  - search:
      lang:
        - ru
        - en
        - es
        - de
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: false
      languages:
        - locale: en
          name: English
          build: true
          site_name: Granular Synthesis
          site_description: A textbook on granular synthesis for electronic musicians, from the first grain to playing live.
          copyright: >
            Text and illustrations are under <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC BY-NC-SA 4.0</a>. <a href="https://paypal.me/limbmusic">Support the author</a>.
            Program names and interfaces belong to their owners.
